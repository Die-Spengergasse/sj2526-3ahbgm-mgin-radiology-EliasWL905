<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>add new patient</title>
    <link rel="stylesheet" th:href="@{/design.css}">
</head>
<body>
<div class="container">
    <h2>Add new patient</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/patient/add}" th:object="${Patient}" method="post">
        <div class="form-group">
            <label>Social Security Number</label>
            <input type="text" th:field="*{svnr}" class="form-control" placeholder="10 Ziffern, z.B. 1234010190">
        </div>
        <div class="form-group">
            <label>Firstname</label>
            <input type="text" th:field="*{firstname}" class="form-control" placeholder="e.g. Max">
        </div>
        <div class="form-group">
            <label>Lastname</label>
            <input type="text" th:field="*{lastname}" class="form-control" placeholder="e.g. Mustermann">
        </div>
        <div class="form-group">
            <label>Gender</label>
            <select th:field="*{gender}" class="form-control">
                <option value="">please select an option</option>
                <option value="MALE">male</option>
                <option value="FEMALE">female</option>
                <option value="DIVERSE">diverse</option>
            </select>
        </div>
        <div class="form-group">
            <label>Birth</label>
            <input type="date" th:field="*{birth}" class="form-control">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add new patient</button>
            <a th:href="@{/}" class="btn btn-primary">Home</a>
        </div>
    </form>
</div>
</body>
</html>
